<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>煙位地圖</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1d1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="煙位地圖">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#f3f1ee; --panel:#ffffff; --fg:#1d1b19; --muted:#6d6862; --line:#e2ddd6;
  --ember:#e2582b; --bin:#d98a1c; --tray:#4a4643; --zone:#2f8a5b; --lock:#9b958e;
  --font:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --panel:#1f1d1b; --fg:#f1ede8; --muted:#a39d96; --line:#34302c;
  --tray:#c9c3bc; --lock:#6d6862; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:15px}
#map{position:fixed;inset:0}
.top{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.brand{background:var(--panel);border-radius:12px;padding:8px 12px;font-weight:800;box-shadow:0 2px 10px #0002;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px #e2582b33}
.status{margin-left:auto;background:var(--panel);border-radius:12px;padding:6px 10px;box-shadow:0 2px 10px #0002;font-size:13px;text-align:right;line-height:1.3}
.status b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.pill.on{background:#2f8a5b22;color:var(--zone)} .pill.off{background:#e2582b22;color:var(--ember)}
.filters{position:fixed;z-index:1000;top:calc(62px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%}
.lockbar{position:fixed;z-index:1000;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 4px 16px #0004}
.lockbar strong{color:#ffb08f}
.dock{position:fixed;z-index:1000;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:14px;padding:14px 10px;font:inherit;font-weight:600;cursor:pointer;background:var(--panel);color:var(--fg);box-shadow:0 2px 10px #0002}
.btn.primary{background:var(--ember);color:#fff}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.btn:disabled{opacity:.5}
.crosshair{position:fixed;z-index:999;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;pointer-events:none}
.sheet{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:var(--panel);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px #0003;display:grid;gap:12px;max-height:80vh;overflow:auto}
.sheet h2{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:13px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.types label{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:13px;cursor:pointer}
.types input{display:none}
.types input:checked+span{font-weight:800}
.types label:has(input:checked){border-color:var(--ember);background:#e2582b14}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}
.toast{position:fixed;z-index:1200;left:50%;top:calc(110px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:90vw}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px #0005}
.pin span{transform:rotate(45deg);font-size:14px;line-height:1}
.pin.guess{border-style:dashed;opacity:.8}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#eee;color:#555;margin-left:4px;vertical-align:middle}
.badge.warn{background:#fde7dd;color:#b13d12}
.ask-warn{color:var(--ember)!important;font-weight:600}
.pin.locked{background:var(--lock)!important;opacity:.6}
.pop{min-width:200px;font-family:var(--font)}
.pop h3{margin:0 0 4px;font-size:15px}
.pop .meta{color:#777;font-size:12px;margin:2px 0}
.pop img{width:100%;border-radius:8px;margin:6px 0}
.pop .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop button,.pop a.nav{flex:1;border:0;border-radius:8px;padding:7px;font:inherit;font-size:13px;cursor:pointer;text-align:center;text-decoration:none}
.pop .ok{background:#2f8a5b;color:#fff}.pop .gone{background:#eee;color:#333}.pop a.nav{background:#1d1b19;color:#fff}
.install{position:fixed;z-index:1050;left:12px;right:12px;top:calc(110px + env(safe-area-inset-top,0px));background:var(--panel);color:var(--fg);border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px #0003;display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.4}
.install span{flex:1}
.me-dot{width:16px;height:16px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 6px #2a7de133}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="brand"><i></i>煙位地圖</div>
  <div class="status" id="status">載入中…</div>
</div>

<div class="filters" id="filters">
  <button class="chip" data-type="bin_ashtray" aria-pressed="true"><span class="dot" style="background:var(--bin)"></span>垃圾桶煙灰缸</button>
  <button class="chip" data-type="ashtray" aria-pressed="true"><span class="dot" style="background:var(--tray)"></span>煙灰缸</button>
  <button class="chip" data-type="smoking_area" aria-pressed="true"><span class="dot" style="background:var(--zone)"></span>吸煙區</button>
  <button class="chip" data-type="nsa" aria-pressed="true"><span class="dot" style="background:#d33"></span>禁煙區</button>
</div>

<div class="lockbar" id="lockbar" hidden></div>

<div class="dock">
  <button class="btn" id="btnLocate">📍 定位</button>
  <button class="btn" id="btnSmoke">🚬 我食緊煙</button>
  <button class="btn primary" id="btnAdd">＋ 分享煙位</button>
</div>

<svg class="crosshair" id="crosshair" hidden viewBox="0 0 34 34"><path d="M17 33 L6 16 A12 12 0 1 1 28 16 Z" fill="#e2582b" stroke="#fff" stroke-width="2"/><circle cx="17" cy="12" r="4" fill="#fff"/></svg>

<form class="sheet" id="addSheet" hidden>
  <h2>分享一個煙位</h2>
  <p>拖地圖，令紅色針對準個位置。只可以分享你附近 300 米內嘅地點。</p>
  <div class="types">
    <label><input type="radio" name="type" value="bin_ashtray" checked><span>🗑️<br>垃圾桶煙灰缸</span></label>
    <label><input type="radio" name="type" value="ashtray"><span>🚬<br>煙灰缸</span></label>
    <label><input type="radio" name="type" value="smoking_area"><span>🌿<br>吸煙區</span></label>
  </div>
  <input type="text" id="note" maxlength="140" placeholder="備註（例如：港鐵 A 出口右手邊）">
  <input type="text" id="nick" maxlength="20" placeholder="你嘅暱稱（會顯示俾其他人睇）">
  <label class="btn" style="text-align:center">📷 <span id="photoLabel">影張相（+3 分）</span><input type="file" id="photo" accept="image/*" capture="environment" hidden></label>
  <div class="row">
    <button type="button" class="btn" id="btnCancel">取消</button>
    <button type="submit" class="btn primary" id="btnSubmit">分享（+10 分）</button>
  </div>
</form>

<div class="sheet" id="askSheet" hidden>
  <h2 id="askTitle"></h2>
  <p id="askBody"></p>
  <div class="row" id="askActs"></div>
</div>

<div class="install" id="install" hidden>
  <span id="installText"></span>
  <button type="button" class="chip" id="installBtn" hidden>安裝</button>
  <button type="button" class="chip" id="installClose" aria-label="關閉">✕</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
